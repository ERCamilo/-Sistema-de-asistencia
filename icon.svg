<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Sistema de Asistencia</title>
  <desc id="description">Casco de construcción cian con una marca de verificación verde.</desc>
  <defs>
    <linearGradient id="background" x1="70" y1="42" x2="442" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111c31"/>
      <stop offset="1" stop-color="#0b1324"/>
    </linearGradient>
    <linearGradient id="helmet" x1="104" y1="146" x2="411" y2="370" gradientUnits="userSpaceOnUse">
