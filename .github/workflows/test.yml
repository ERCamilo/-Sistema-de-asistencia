name: tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    name: Jest suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version and notes
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$RELEASE_BASE" ] && [ "$RELEASE_BASE" != 0000000000000000000000000000000000000000 ]; then
            node scripts/release-manifest.cjs --check --release --base "$RELEASE_BASE" --head "$RELEASE_HEAD"
          else
            node scripts/release-manifest.cjs --check --release --head "$RELEASE_HEAD"
          fi

      # Enforce the direct-state-write ratchet on CI too (not just the opt-in
      # pre-commit hook) so the guard can't be bypassed on a PR from a machine
      # without the hook installed.
      - name: State-write ratchet (guard)
        run: npm run lint:state

      - name: Run tests
        run: npm test -- --json --outputFile="$RUNNER_TEMP/jest-results.json"

      # Preserve Jest's exit status; expose failures via annotations/summary too.
      - name: Report test failures
        if: always()
        run: node scripts/report-jest-results.cjs "$RUNNER_TEMP/jest-results.json"

      # Same command Cloudflare Pages runs to publish dist/: a bundle that
      # fails to build must fail here, on the PR, not in the deploy.
      - name: Production build
        run: npm run build

      # jsdom cannot detect clipped controls or mobile navigation overlap.
      # ubuntu-latest provides Chrome; this fixture uses only local assets.
      - name: Settings layout in Chromium
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run test:settings-layout

      - name: Photo viewer recovery in Chromium
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run test:photo-viewer

      - name: App update and release notes in Chromium
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run test:app-updates
