name: tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    name: Jest suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Enforce the direct-state-write ratchet on CI too (not just the opt-in
      # pre-commit hook) so the guard can't be bypassed on a PR from a machine
      # without the hook installed.
      - name: State-write ratchet (guard)
        run: npm run lint:state

      - name: Run tests
        run: npm test
