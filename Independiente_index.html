        function AttendanceTab() {
            return `${DateControls()}${state.viewMode === 'day' ? DayView() : WeekView()}`;
        }
        
        function FloatingCard() {
            if (!state.showFloatingCard || !state.floatingCardEmployee) return '';
            const emp = state.floatingCardEmployee;
            const days = getDaysInMonth(state.floatingCardMonth);
            const dayN = ['D', 'L', 'M', 'M', 'J', 'V', 'S'];
            const today = getDateKey(new Date());
            const l7 = new Date(); l7.setDate(l7.getDate() - 6);
            const h7 = getEmployeeTotalHours(emp.id, l7, new Date());
            const fm = new Date(); fm.setDate(1);
            const hm = getEmployeeTotalHours(emp.id, fm, new Date());
            const chartData = getChartData(emp.id, state.chartPeriod);
            const maxH = Math.max(...chartData.map(d => d.regular + d.overtime + d.holiday + d.absent), 1);
            const scale = 140 / maxH;
            
            return `<div class="overlay" onclick="closeFloatingCard()"></div><div class="floating-card" onclick="event.stopPropagation()"><div class="floating-card-header"><div class="floating-card-title">👤 ${emp.name}</div><button class="floating-card-close" onclick="closeFloatingCard()">✕</button></div><div class="stats-compact"><div class="stat-compact"><div class="stat-compact-label">Últimos 7 días</div><div class="stat-compact-value">${h7}h</div></div><div class="stat-compact"><div class="stat-compact-label">Este mes</div><div class="stat-compact-value">${hm}h</div></div></div><div class="calendar-compact"><div class="calendar-nav"><button class="calendar-nav-btn" onclick="changeFloatingMonth(-1)">◀</button><div class="calendar-month">${formatMonthYear(state.floatingCardMonth)}</div><button class="calendar-nav-btn" onclick="changeFloatingMonth(1)">▶</button></div><div class="calendar-header">${dayN.map(d => `<div class="calendar-header-day">${d}</div>`).join('')}</div><div class="calendar-grid">${days.map(({ date, currentMonth }) => {
                const dKey = getDateKey(date);
                const aKey = `${emp.id}-${dKey}`;
                const att = state.attendance[aKey];
                const isT = dKey === today;
                let cls = ['calendar-day'];
                if (!currentMonth) cls.push('other-month');
                if (att && att.present) {
                    cls.push('has-attendance');
                    const col = getCheckColor(att, date).replace('check-', '');
                    cls.push(col);
                }
                if (isT) cls.push('today');
                return `<div class="${cls.join(' ')}"><div>${date.getDate()}</div>${att && att.present ? `<div class="calendar-day-hours">${att.hoursWorked}h</div>` : ''}</div>`;
            }).join('')}</div></div><div class="chart-compact"><div class="chart-compact-header"><div class="chart-compact-title">📈 ${state.chartPeriod === 'all' ? 'Historial por Meses' : 'Asistencia y Horas'}</div><div class="chart-filter"><button class="chart-filter-btn ${state.chartPeriod === 'week' ? 'active' : ''}" onclick="changeChartPeriod('week')">7D</button><button class="chart-filter-btn ${state.chartPeriod === 'month' ? 'active' : ''}" onclick="changeChartPeriod('month')">Mes</button><button class="chart-filter-btn ${state.chartPeriod === 'all' ? 'active' : ''}" onclick="changeChartPeriod('all')">Todo</button></div></div><div class="chart-bars">${chartData.map(d => {
                const tot = (d.regular + d.overtime + d.holiday + d.absent) * scale;
                const rH = d.regular * scale;
                const oH = d.overtime * scale;
                const hH = d.holiday * scale;
                const aH = d.absent * scale;
                return `<div class="chart-bar-wrapper"><div class="chart-bar" style="height:${Math.max(tot, 10)}px;">${d.absent > 0 ? `<div class="chart-segment absent" style="height:${aH}px;"></div>` : ''}${d.regular > 0 ? `<div class="chart-segment regular" style="height:${rH}px;"></div>` : ''}${d.overtime > 0 ? `<div class="chart-segment overtime" style="height:${oH}px;"></div>` : ''}${d.holiday > 0 ? `<div class="chart-segment holiday" style="height:${hH}px;"></div>` : ''}</div><div class="chart-bar-label">${d.label || `${d.date.getDate()}/${d.date.getMonth() + 1}`}</div></div>`;
            }).join('')}</div></div></div>`;
        }

        // Función para actualizar preview de sueldo
        window.updateSalaryPreview = function() {
            const amountInput = document.getElementById('posSalary');
            const periodInput = document.getElementById('posPeriod');
            const workDaysInputs = document.querySelectorAll('input[name="posWorkDays"]:checked');
            
            if (!amountInput || !periodInput) return;
            
            const amount = parseFloat(amountInput.value) || 0;
            const period = periodInput.value;
            const workDaysCount = workDaysInputs.length || 7;
            
            // Actualizar visuales de días
            document.querySelectorAll('.day-checkbox').forEach((el, idx) => {
                const checkbox = document.querySelector(`input[name="posWorkDays"][value="${idx}"]`);
                if (checkbox) {
                    el.classList.toggle('active', checkbox.checked);
                }
            });
            
            // Calcular sueldos
            let dailySalary = 0;
            switch(period) {
                case 'day': dailySalary = amount; break;
                case 'week': dailySalary = amount / workDaysCount; break;
                case 'biweekly': dailySalary = amount / (workDaysCount * 2); break;
                case '3weeks': dailySalary = amount / (workDaysCount * 3); break;
                case 'month': dailySalary = amount / (workDaysCount * 4.33); break;
            }
            
            const previewDay = document.getElementById('preview-day');
            const previewWeek = document.getElementById('preview-week');
            const previewBiweekly = document.getElementById('preview-biweekly');
            const preview3weeks = document.getElementById('preview-3weeks');
            const previewMonth = document.getElementById('preview-month');
            
            if (previewDay) previewDay.textContent = '$' + dailySalary.toFixed(2);
            if (previewWeek) previewWeek.textContent = '$' + (dailySalary * workDaysCount).toFixed(2);
            if (previewBiweekly) previewBiweekly.textContent = '$' + (dailySalary * workDaysCount * 2).toFixed(2);
            if (preview3weeks) preview3weeks.textContent = '$' + (dailySalary * workDaysCount * 3).toFixed(2);
            if (previewMonth) previewMonth.textContent = '$' + (dailySalary * workDaysCount * 4.33).toFixed(2);
        };
        
        // Inicializar event listeners del modal de posición

            setTimeout(() => {
                const salaryInput = document.getElementById('posSalary');

                const workDayInputs = document.querySelectorAll('input[name="posWorkDays"]');
                
                if (salaryInput) salaryInput.addEventListener('input', window.updateSalaryPreview);
                if (periodInput) periodInput.addEventListener('change', window.updateSalaryPreview);
                workDayInputs.forEach(input => {
                    input.addEventListener('change', window.updateSalaryPreview);
                });
                
                window.updateSalaryPreview();
            }, 100);
        };

        function EmployeeReportContent() {
            const reportData = calculateEmployeeReportData();
            
            if (reportData.positions.length === 0) {
                return `
                    <div style="text-align: center; padding: 60px 20px; color: #64748b;">
                        <div style="font-size: 3rem; margin-bottom: 12px; opacity: 0.3;">📋</div>
                        <div style="font-size: 1.125rem; margin-bottom: 8px;">No hay datos para mostrar</div>
                        <div style="font-size: 0.875rem;">Agrega empleados y registra asistencia para ver el reporte</div>
                    </div>
                `;
            }
            
            return `
                <div>
                    ${EmployeeReportGeneralSection(reportData)}
                    ${reportData.positions.map(posData => EmployeeReportPositionSection(posData, reportData.days)).join('')}
                </div>
            `;
        }
        
        function EmployeeReportGeneralSection(reportData) {
            const isCollapsed = state.collapsedPositions['general'];
            
            // Crear lista unificada de todos los empleados
            const allEmployeesMap = new Map();
            
            // Recorrer todas las posiciones y consolidar datos
            reportData.positions.forEach(posData => {
                posData.employees.forEach(empData => {
                    if (!allEmployeesMap.has(empData.id)) {
                        // Primera vez que vemos este empleado
                        allEmployeesMap.set(empData.id, {
                            id: empData.id,
                            number: empData.number,
                            name: empData.name,
                            dayValues: {},
                            daysWorked: 0,
                            totalHours: 0,
                            totalDays: 0
                        });
                    }
                    
                    const employee = allEmployeesMap.get(empData.id);
                    
                    // Consolidar días trabajados
                    Object.keys(empData.dayValues).forEach(dateKey => {
                        if (!employee.dayValues[dateKey]) {
                            employee.dayValues[dateKey] = 0;
                            employee.daysWorked++;
                        }
                        employee.dayValues[dateKey] += empData.dayValues[dateKey];
                    });
                });
            });
            
            // Calcular totales para cada empleado
            const allEmployees = Array.from(allEmployeesMap.values()).map(emp => {
                // Calcular total de días (suma de valores)
                emp.totalDays = Object.values(emp.dayValues).reduce((sum, val) => sum + val, 0);
                
                // Calcular total de horas trabajadas
                reportData.days.forEach(day => {
                    const dateKey = getDateKey(day.date);
                    const attKey = `${emp.id}-${dateKey}`;
                    const att = state.attendance[attKey];
                    
                    if (att && att.present) {
                        emp.totalHours += (att.hoursWorked || 0);
                    }
                });
                
                return emp;
            });
            
            // Ordenar por número de empleado
            allEmployees.sort((a, b) => a.number.localeCompare(b.number));
            
            return `
                <div style="background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 16px; border: 1px solid #334155;">
                    <!-- Header colapsable -->
                    <div onclick="togglePositionCollapse('general')" 
                         style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; margin-bottom: ${isCollapsed ? '0' : '16px'}; padding-bottom: ${isCollapsed ? '0' : '16px'}; border-bottom: ${isCollapsed ? 'none' : '1px solid #334155'};">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <div style="font-size: 1.25rem;">📊</div>
                            <h3 style="margin: 0; font-size: 1.125rem; color: #f1f5f9; font-weight: 700;">
                                Resumen General
                            </h3>
                            <span style="background: #334155; color: #94a3b8; padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600;">
                                ${allEmployees.length} empleado${allEmployees.length !== 1 ? 's' : ''}
                            </span>
                        </div>
                        <div style="color: #64748b; font-size: 1.25rem; transition: transform 0.2s;">
                            ${isCollapsed ? '▶' : '▼'}
                        </div>
                    </div>
                    
                    ${isCollapsed ? '' : `
                        <div style="overflow-x: auto;">
                            ${EmployeeReportGeneralTable(allEmployees, reportData.days)}
                        </div>
                    `}
                </div>
            `;
        }
        
        function EmployeeReportGeneralTable(employees, days) {
            const regularHours = state.settings.regularHoursPerDay;
            
            // Diminutivos de días
            const dayNames = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            
            return `
                <table style="width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.875rem;">

                            <th style="position: sticky; left: 50px; z-index: 10; background: #1e293b; padding: 12px 8px; text-align: left; font-weight: 600; color: #94a3b8; border-bottom: 2px solid #334155; min-width: 150px;">Empleado</th>
                            ${days.map(day => {

                                const dayName = dayNames[dayOfWeek];
                                
                                return `<th style="background: #1e293b; padding: 8px 4px; text-align: center; font-weight: 600; color: ${day.isHoliday ? '#f59e0b' : isWeekend ? '#64748b' : '#94a3b8'}; border-bottom: 2px solid #334155; min-width: 50px; font-size: 0.7rem;">

                                    <div style="font-size: 0.85rem; margin-top: 2px;">${d.getDate()}</div>

                                </th>`;
                            }).join('')}
                            <th style="position: sticky; right: 120px; z-index: 10; background: #1e293b; padding: 12px 8px; text-align: center; font-weight: 600; color: #10b981; border-bottom: 2px solid #334155; min-width: 60px; font-size: 0.75rem;">Días<br>Trab.</th>
                            <th style="position: sticky; right: 60px; z-index: 10; background: #1e293b; padding: 12px 8px; text-align: center; font-weight: 600; color: #3b82f6; border-bottom: 2px solid #334155; min-width: 60px; font-size: 0.75rem;">Horas<br>Totales</th>
                            <th style="position: sticky; right: 0; z-index: 10; background: #1e293b; padding: 12px 8px; text-align: center; font-weight: 700; color: #06b6d4; border-bottom: 2px solid #334155; min-width: 60px;">TOTAL</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${employees.map((emp, idx) => {
                            const rowBg = idx % 2 === 0 ? '#0f172a' : 'transparent';
                            return `
                                <tr style="background: ${rowBg};">
                                    <td style="position: sticky; left: 0; z-index: 5; background: inherit; padding: 10px 8px; font-weight: 600; color: #94a3b8; border-bottom: 1px solid #1e293b;">${emp.number}</td>
                                    <td style="position: sticky; left: 50px; z-index: 5; background: inherit; padding: 10px 8px; color: #f1f5f9; border-bottom: 1px solid #1e293b;">${emp.name}</td>
                                    ${days.map(day => {
                                        const dateKey = getDateKey(day.date);
                                        const value = emp.dayValues[dateKey];
                                        
                                        // Determinar qué mostrar
                                        let displayText = '-';
                                        let displayColor = '#334155';
                                        let fontWeight = '400';
                                        
                                        if (value && value > 0) {
                                            fontWeight = '700';
                                            
                                            // Si el valor es exactamente 1, mostrar ✓
                                            if (Math.abs(value - 1) < 0.01) {
                                                displayText = '✓';
                                                displayColor = day.isHoliday ? '#f59e0b' : '#10b981';
                                            } 
                                            // Si es menor a 1, mostrar número en rojo
                                            else if (value < 1) {
                                                displayText = value.toFixed(1);
                                                displayColor = '#ef4444'; // Rojo
                                            }
                                            // Si es mayor a 1, mostrar número en azul
                                            else {
                                                displayText = value.toFixed(1);
                                                displayColor = '#3b82f6'; // Azul
                                            }
                                        }
                                        
                                        return `<td style="padding: 10px 4px; text-align: center; color: ${displayColor}; border-bottom: 1px solid #1e293b; font-weight: ${fontWeight};">
                                            ${displayText}
                                        </td>`;
                                    }).join('')}
                                    <td style="position: sticky; right: 120px; z-index: 5; background: inherit; padding: 10px 8px; text-align: center; font-weight: 700; color: #10b981; border-bottom: 1px solid #1e293b; font-size: 1rem;">${emp.daysWorked}</td>
                                    <td style="position: sticky; right: 60px; z-index: 5; background: inherit; padding: 10px 8px; text-align: center; font-weight: 700; color: #3b82f6; border-bottom: 1px solid #1e293b; font-size: 1rem;">${emp.totalHours.toFixed(1)}h</td>
                                    <td style="position: sticky; right: 0; z-index: 5; background: inherit; padding: 10px 8px; text-align: center; font-weight: 700; color: #06b6d4; border-bottom: 1px solid #1e293b; font-size: 1.125rem;">${emp.totalDays.toFixed(2)}</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }
        
        function EmployeeReportPositionSection(posData, days) {
            const isCollapsed = state.collapsedPositions[posData.position.id];
            
            return `
                <div style="background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 16px; border: 1px solid #334155;">

                    <div onclick="togglePositionCollapse('${posData.position.id}')"

                        <div style="display: flex; align-items: center; gap: 12px;">

                                ${posData.position.name}

                            <span style="background: #334155; color: #94a3b8; padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600;">
                                ${posData.employees.length} empleado${posData.employees.length !== 1 ? 's' : ''}
                            </span>

                        <div style="color: #64748b; font-size: 1.25rem; transition: transform 0.2s;">

                    <!-- Tabla (colapsable) -->
                    ${isCollapsed ? '' : `

        function EmployeeReportTable(posData, days) {
            const regularHours = state.settings.regularHoursPerDay;
            const holidayFactor = state.settings.holidayFactor;
            
            return `
                <table style="width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.875rem;">

                            <th style="position: sticky; left: 0; z-index: 10; background: #1e293b; padding: 12px 8px; text-align: left; font-weight: 600; color: #94a3b8; border-bottom: 2px solid #334155; min-width: 50px;">#</th>
                            <th style="position: sticky; left: 50px; z-index: 10; background: #1e293b; padding: 12px 8px; text-align: left; font-weight: 600; color: #94a3b8; border-bottom: 2px solid #334155; min-width: 120px;">Nombre</th>

                                else if (isSunday) bgColor = '#1e40af';  // Azul oscuro domingo
                                
                                return `
                                    <th style="padding: 8px 4px; text-align: center; font-weight: 600; color: #fff; border-bottom: 2px solid #334155; min-width: 50px; background: ${bgColor};">
                                        <div style="font-size: 0.75rem;">${dayName}</div>
                                        <div style="font-size: 0.875rem; font-weight: 700;">${dayNum}</div>
                                    </th>
                                `;
                            }).join('')}

                                        ${dayTotal.toFixed(1)}

                        </tr>
                    </tbody>
                </table>
                
                <!-- Leyenda de colores -->

                    </div>
                </div>

        // Funciones auxiliares para Employee Report
        function calculateEmployeeReportData() {
            const startDate = state.employeeReportStartDate;
            const endDate = state.employeeReportEndDate;
            const regularHours = state.settings.regularHoursPerDay;
            const holidayFactor = state.settings.holidayFactor;
            
            // Generar array de días
            const days = [];
            for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                const date = new Date(d);
                days.push({
                    date: date,
                    isHoliday: isDayHoliday(date)
                });
            }
            
            // Agrupar por posición
            const activePositions = state.positions.filter(p => p.active);
            const positions = [];
            
            activePositions.forEach(position => {
                const employees = [];
                
                // Obtener empleados de esta posición que estuvieron activos en el rango
                const empsByPosition = state.employees.filter(e => {
                    // Verificar si estuvo activo en algún momento del rango
                    if (!wasEmployeeActiveInRange(e, startDate, endDate)) {
                        return false;
                    }
                    
                    // Soportar tanto position (string) como positions (array)
                    if (e.positions && Array.isArray(e.positions)) {
                        return e.positions.includes(position.id);
                    } else if (e.position) {
                        return e.position === position.id;
                    }
                    return false;
                });
                
                empsByPosition.forEach(emp => {
                    const dayValues = {};
                    let total = 0;
                    
                    // Calcular valor por cada día
                    days.forEach(day => {
                        const dateKey = getDateKey(day.date);
                        const attKey = `${emp.id}-${dateKey}`;
                        const att = state.attendance[attKey];
                        
                        if (att && att.present) {
                            let dayValue = 0;
                            
                            // Si tiene multi-posición, buscar horas de esta posición específica
                            if (att.multiPosition && att.positionHours) {
                                const posHours = att.positionHours.find(ph => ph.positionId === position.id);
                                if (posHours && posHours.hours) {
                                    dayValue = (posHours.hours || 0) / regularHours;
                                }
                            } else {
                                // Usar horas totales
                                dayValue = (att.hoursWorked || 0) / regularHours;
                            }
                            
                            // Aplicar factor festivo
                            if (day.isHoliday || att.isHoliday) {
                                dayValue *= (holidayFactor || 1);
                            }
                            
                            // Asegurar que dayValue es un número válido
                            if (!isNaN(dayValue) && isFinite(dayValue)) {
                                dayValues[dateKey] = dayValue;
                                total += dayValue;
                            }
                        }
                    });
                    
                    // Solo agregar empleado si tiene datos válidos
                    if (!isNaN(total) && isFinite(total)) {
                        employees.push({
                            id: emp.id,
                            number: emp.number,
                            name: emp.name,
                            dayValues: dayValues,
                            total: total
                        });
                    }
                });
                
                if (employees.length > 0) {
                    positions.push({
                        position: position,
                        employees: employees
                    });
                }
            });
            
            return {
                days: days,
                positions: positions
            };
        }
        
        // Calendarios para Employee Report
        function EmployeeReportStartDatePicker() {
            const month = state.employeeReportStartPickerMonth;
            return generateDatePicker(month, state.employeeReportStartDate, 'selectEmployeeReportStartDate', 'changeEmployeeReportStartPickerMonth');
        }
        
        function EmployeeReportEndDatePicker() {
            const month = state.employeeReportEndPickerMonth;
            return generateDatePicker(month, state.employeeReportEndDate, 'selectEmployeeReportEndDate', 'changeEmployeeReportEndPickerMonth');
        }
        
        function generateDatePicker(month, selectedDate, selectFunc, changeMonthFunc) {
            const year = month.getFullYear();
            const monthIndex = month.getMonth();
            const firstDay = new Date(year, monthIndex, 1);
            const lastDay = new Date(year, monthIndex + 1, 0);
            const startDayOfWeek = firstDay.getDay();
            const days = [];
            const prevMonthLastDay = new Date(year, monthIndex, 0).getDate();
            
            for (let i = startDayOfWeek - 1; i >= 0; i--) {
                days.push({ date: new Date(year, monthIndex - 1, prevMonthLastDay - i), currentMonth: false });
            }
            for (let i = 1; i <= lastDay.getDate(); i++) {
                days.push({ date: new Date(year, monthIndex, i), currentMonth: true });
            }
            const remainingDays = 42 - days.length;
            for (let i = 1; i <= remainingDays; i++) {
                days.push({ date: new Date(year, monthIndex + 1, i), currentMonth: false });
            }
            
            const today = getDateKey(new Date());
            const selected = getDateKey(selectedDate);
            const dayNames = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
            
            return `<div class="date-picker" onclick="event.stopPropagation()">
                <div class="date-picker-header">
                    <button class="date-btn" style="width:32px;height:32px;font-size:1rem;" onclick="event.stopPropagation(); ${changeMonthFunc}(-1)">◀</button>
                    <div class="date-picker-month">${formatMonthYear(month)}</div>
                    <button class="date-btn" style="width:32px;height:32px;font-size:1rem;" onclick="event.stopPropagation(); ${changeMonthFunc}(1)">▶</button>
                </div>
                <div class="date-picker-grid">
                    ${dayNames.map(d => `<div class="date-picker-day-label">${d}</div>`).join('')}
                    ${days.map(({ date, currentMonth }) => {
                        const dKey = getDateKey(date);
                        let cls = ['date-picker-day'];
                        if (!currentMonth) cls.push('other-month');
                        if (dKey === today) cls.push('today');
                        if (dKey === selected) cls.push('selected');
                        return `<div class="${cls.join(' ')}" onclick="event.stopPropagation(); ${selectFunc}('${date.toISOString()}')">${date.getDate()}</div>`;
                    }).join('')}
                </div>
            </div>`;
        }

            state.employeeReportStartDate.setDate(now.getDate() - diff);

                // Generar archivo
                const buffer = await workbook.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const filename = `Reporte_Empleados_${getDateKey(startDate)}_${getDateKey(endDate)}.xlsx`;
                
                // Mostrar menú de exportar
                showExportMenu({

                    text: `Reporte del ${formatDateShort(startDate)} al ${formatDateShort(endDate)}`
                });
                
            } catch (error) {

        function SettingsHolidayCalendar() {
            const month = state.settingsCalendarMonth;
            const year = month.getFullYear();
            const monthIndex = month.getMonth();
            
            const firstDay = new Date(year, monthIndex, 1);
            const lastDay = new Date(year, monthIndex + 1, 0);
            const startDayOfWeek = firstDay.getDay();
            
            const days = [];
            
            // Días del mes anterior
            const prevMonthLastDay = new Date(year, monthIndex, 0).getDate();
            for (let i = startDayOfWeek - 1; i >= 0; i--) {
                days.push({ date: new Date(year, monthIndex - 1, prevMonthLastDay - i), currentMonth: false });
            }
            
            // Días del mes actual
            for (let i = 1; i <= lastDay.getDate(); i++) {
                days.push({ date: new Date(year, monthIndex, i), currentMonth: true });
            }
            
            // Días del mes siguiente
            const remainingDays = 42 - days.length;
            for (let i = 1; i <= remainingDays; i++) {
                days.push({ date: new Date(year, monthIndex + 1, i), currentMonth: false });
            }
            
            const dayNames = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            
            return `
                <div style="background: #0f172a; border-radius: 8px; padding: 16px;">
                    <!-- Header del calendario -->
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                        <button type="button" 
                                onclick="changeSettingsCalendarMonth(-1)" 
                                style="background: #1e293b; border: 1px solid #334155; color: #06b6d4; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 1.25rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s;"
                                onmouseover="this.style.borderColor='#06b6d4'; this.style.background='#334155'"
                                onmouseout="this.style.borderColor='#334155'; this.style.background='#1e293b'">
                            ◀
                        </button>
                        <div style="font-size: 1rem; font-weight: 700; color: #f1f5f9;">
                            ${formatMonthYear(month)}
                        </div>
                        <button type="button" 
                                onclick="changeSettingsCalendarMonth(1)" 
                                style="background: #1e293b; border: 1px solid #334155; color: #06b6d4; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 1.25rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s;"
                                onmouseover="this.style.borderColor='#06b6d4'; this.style.background='#334155'"
                                onmouseout="this.style.borderColor='#334155'; this.style.background='#1e293b'">
                            ▶
                        </button>
                    </div>
                    
                    <!-- Grid del calendario -->
                    <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;">
                        <!-- Nombres de días -->
                        ${dayNames.map(name => `
                            <div style="text-align: center; padding: 8px; font-size: 0.75rem; font-weight: 600; color: #64748b;">
                                ${name}
                            </div>
                        `).join('')}
                        
                        <!-- Días -->
                        ${days.map(({ date, currentMonth }) => {
                            const dateKey = getDateKey(date);
                            const isHoliday = state.settings.holidays.includes(dateKey);
                            const isToday = dateKey === getDateKey(new Date());
                            
                            let bgColor = '#1e293b';
                            let textColor = currentMonth ? '#f1f5f9' : '#475569';
                            let borderColor = '#334155';
                            
                            if (isHoliday) {
                                bgColor = 'linear-gradient(135deg, #f59e0b, #fbbf24)';
                                textColor = '#fff';
                                borderColor = '#f59e0b';
                            }
                            
                            if (isToday && !isHoliday) {
                                borderColor = '#06b6d4';
                            }
                            
                            return `
                                <button type="button"
                                        onclick="${currentMonth ? `toggleHoliday('${dateKey}')` : ''}"
                                        style="
                                            background: ${bgColor};
                                            border: 2px solid ${borderColor};
                                            color: ${textColor};
                                            padding: 8px;
                                            border-radius: 8px;
                                            cursor: ${currentMonth ? 'pointer' : 'default'};
                                            font-size: 0.875rem;
                                            font-weight: ${isHoliday ? '700' : '500'};
                                            transition: all 0.2s;
                                            position: relative;
                                            ${!currentMonth ? 'opacity: 0.3;' : ''}
                                        "
                                        ${currentMonth ? `
                                            onmouseover="this.style.transform='scale(1.1)'; this.style.boxShadow='0 4px 12px rgba(0,0,0,0.3)'"
                                            onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='none'"
                                        ` : ''}>
                                    ${date.getDate()}
                                    ${isHoliday ? '<div style="position: absolute; top: 2px; right: 2px; font-size: 0.625rem;">☀️</div>' : ''}
                                </button>
                            `;
                        }).join('')}
                    </div>
                    
                    <!-- Leyenda -->
                    <div style="display: flex; justify-content: center; gap: 20px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #334155;">
                        <div style="display: flex; align-items: center; gap: 8px; font-size: 0.75rem;">
                            <div style="width: 20px; height: 20px; background: linear-gradient(135deg, #f59e0b, #fbbf24); border-radius: 4px; border: 2px solid #f59e0b;"></div>
                            <span style="color: #94a3b8;">Día Festivo</span>

        }
        
        // Funciones para Settings

            const month = state.settingsCalendarMonth;

        window.toggleHoliday = function(dateKey) {
            const holidays = state.settings.holidays;
            const index = holidays.indexOf(dateKey);
            
            if (index > -1) {
                // Remover
                holidays.splice(index, 1);
            } else {
                // Agregar
                holidays.push(dateKey);
                holidays.sort(); // Mantener ordenados
            }
            
            render();
        };
        
        window.saveSettings = function() {
            // Leer valores del formulario
            const companyName = document.getElementById('companyName').value.trim();
            const regularHoursPerDay = parseFloat(document.getElementById('regularHoursPerDay').value);
            const holidayFactor = parseFloat(document.getElementById('holidayFactor').value);
            
            // Validaciones
            if (!companyName) {
                showNotification('❌ El nombre de la empresa es requerido', 'error');
                return;
            }
            
            if (regularHoursPerDay < 1 || regularHoursPerDay > 24) {
                showNotification('❌ Las horas regulares deben estar entre 1 y 24', 'error');
                return;
            }
            
            if (holidayFactor < 1 || holidayFactor > 5) {
                showNotification('❌ El factor festivo debe estar entre 1 y 5', 'error');
                return;
            }
            
            // Guardar configuración
            state.settings.companyName = companyName;
            state.settings.regularHoursPerDay = regularHoursPerDay;
            state.settings.holidayFactor = holidayFactor;
            
            saveToLocalStorage(); // Guardar en localStorage
            showNotification('✅ Configuración guardada correctamente', 'success');
            render();
        };

        window.exportData = async function() {
            try {
                // Crear objeto con todos los datos
                const exportData = {
                    version: '1.0.0',
                    exportDate: new Date().toISOString(),
                    companyName: state.settings.companyName,
                    data: {
                        settings: state.settings,
                        positions: state.positions,
                        employees: state.employees,
                        leaders: state.leaders,
                        attendance: state.attendance,
                        tempAssignments: state.tempAssignments || [],
                        dayHoursConfig: state.dayHoursConfig || {}
                    }
                };
                
                // Generar nombre de archivo
                const dateStr = new Date().toISOString().split('T')[0];
                const filename = `backup-${state.settings.companyName.replace(/\s+/g, '-')}-${dateStr}.json`;
                
                // Crear blob
                const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
                
                // Mostrar menú de exportar
                showExportMenu({
                    filename: filename,
                    blob: blob,
                    title: `Backup - ${state.settings.companyName}`,
                    text: `Respaldo de datos del ${new Date().toLocaleDateString('es-DO')}`
                });
                
            } catch (error) {
                console.error('Error exportando datos:', error);
                showNotification('❌ Error al exportar datos', 'error');
            }
        };
        
        window.importData = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // Confirmar antes de importar
            const confirmImport = confirm(
                '⚠️ ADVERTENCIA\n\n' +
                'Esto reemplazará TODOS tus datos actuales con los del archivo de respaldo.\n\n' +
                'Se recomienda exportar tus datos actuales primero.\n\n' +
                '¿Estás seguro de continuar?'
            );
            
            if (!confirmImport) {
                event.target.value = ''; // Limpiar input
                return;
            }
            
            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    // Validar estructura
                    if (!importedData.data) {
                        throw new Error('Formato de archivo inválido');
                    }
                    
                    // Importar datos
                    state.settings = importedData.data.settings || state.settings;
                    state.positions = importedData.data.positions || [];
                    state.employees = importedData.data.employees || [];
                    state.attendance = importedData.data.attendance || {};
                    state.tempAssignments = importedData.data.tempAssignments || [];
                    
                    // Guardar en localStorage
                    saveToLocalStorage();
                    
                    showNotification('✅ Datos importados correctamente', 'success');
                    render();
                    
                } catch (error) {
                    console.error('Error importando datos:', error);
                    showNotification('❌ Error al importar datos: ' + error.message, 'error');
                }
            };
            
            reader.onerror = function() {
                showNotification('❌ Error al leer el archivo', 'error');
            };
            
            reader.readAsText(file);
            
            // Limpiar input
            event.target.value = '';
        };
        
        window.deleteAllData = function() {
            // Triple confirmación para acción destructiva
            const confirm1 = confirm(
                '⚠️ ADVERTENCIA: ELIMINAR TODOS LOS DATOS\n\n' +
                'Esta acción es PERMANENTE y NO se puede deshacer.\n\n' +
                'Se eliminarán:\n' +
                '• Todos los empleados\n' +
                '• Todas las posiciones\n' +
                '• Todo el historial de asistencia\n' +
                '• Toda la configuración\n\n' +
                '¿Estás COMPLETAMENTE SEGURO?'
            );
            
            if (!confirm1) return;
            
            const confirm2 = confirm(
                '🚨 ÚLTIMA ADVERTENCIA\n\n' +
                'Una vez eliminados, los datos NO se pueden recuperar.\n\n' +
                'Se recomienda EXPORTAR un backup antes de continuar.\n\n' +
                '¿Deseas continuar con la eliminación?'
            );
            
            if (!confirm2) return;
            
            // Pedir confirmación escribiendo texto
            const confirmText = prompt(
                'Para confirmar, escribe exactamente:\nELIMINAR TODO\n\n' +
                '(Escribe en mayúsculas)'
            );
            
            if (confirmText !== 'ELIMINAR TODO') {
                showNotification('❌ Cancelado: texto de confirmación incorrecto', 'error');
                return;
            }
            
            try {
                // Limpiar localStorage
                localStorage.clear();
                
                // Reiniciar estado a valores por defecto
                state.settings = {
                    companyName: 'Mi Empresa',
                    regularHoursPerDay: 8,
                    holidayFactor: 2,
                    holidays: []
                };
                state.positions = [];
                state.employees = [];
                state.attendance = {};
                state.tempAssignments = [];
                state.leaders = [];
                
                showNotification('✅ Todos los datos han sido eliminados', 'success');
                
                // Recargar página después de 2 segundos para reiniciar onboarding
                setTimeout(() => {
                    location.reload();
                }, 2000);
                
            } catch (error) {
                console.error('Error eliminando datos:', error);
                showNotification('❌ Error al eliminar datos', 'error');
            }
        };

        function DashboardStartDatePicker() {
            const month = state.startDatePickerMonth;
            const year = month.getFullYear();
            const monthIndex = month.getMonth();
            
            const firstDay = new Date(year, monthIndex, 1);
            const lastDay = new Date(year, monthIndex + 1, 0);
            const startDayOfWeek = firstDay.getDay();
            
            const days = [];
            
            // Días del mes anterior
            const prevMonthLastDay = new Date(year, monthIndex, 0).getDate();
            for (let i = startDayOfWeek - 1; i >= 0; i--) {
                days.push({ date: new Date(year, monthIndex - 1, prevMonthLastDay - i), currentMonth: false });
            }
            
            // Días del mes actual
            for (let i = 1; i <= lastDay.getDate(); i++) {
                days.push({ date: new Date(year, monthIndex, i), currentMonth: true });
            }
            
            // Días del mes siguiente
            const remainingDays = 42 - days.length;
            for (let i = 1; i <= remainingDays; i++) {
                days.push({ date: new Date(year, monthIndex + 1, i), currentMonth: false });
            }
            
            const today = getDateKey(new Date());
            const selected = getDateKey(state.dashboardStartDate);
            const dayNames = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
            
            return `<div class="date-picker" onclick="event.stopPropagation()">
                <div class="date-picker-header">
                    <button class="date-btn" style="width:32px;height:32px;font-size:1rem;" onclick="event.stopPropagation(); changeStartDatePickerMonth(-1)">◀</button>
                    <div class="date-picker-month">${formatMonthYear(month)}</div>
                    <button class="date-btn" style="width:32px;height:32px;font-size:1rem;" onclick="event.stopPropagation(); changeStartDatePickerMonth(1)">▶</button>
                </div>
                <div class="date-picker-grid">
                    ${dayNames.map(d => `<div class="date-picker-day-label">${d}</div>`).join('')}
                    ${days.map(({ date, currentMonth }) => {
                        const dKey = getDateKey(date);
                        let cls = ['date-picker-day'];
                        if (!currentMonth) cls.push('other-month');
                        if (dKey === today) cls.push('today');
                        if (dKey === selected) cls.push('selected');
                        return `<div class="${cls.join(' ')}" onclick="event.stopPropagation(); selectStartDate('${date.toISOString()}')">${date.getDate()}</div>`;
                    }).join('')}
                </div>
            </div>`;
        }

        function getHoursChartData() {
            const startDate = new Date(state.dashboardStartDate);
            const endDate = new Date(state.dashboardEndDate);
            
            // Agrupar por semanas
            const weeks = {};
            
            for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                const date = new Date(d);
                const weekStart = new Date(date);
                const day = weekStart.getDay();
                const diff = (day === 0 ? -6 : 1) - day;
                weekStart.setDate(weekStart.getDate() + diff);
                
                const weekKey = getDateKey(weekStart);
                
                if (!weeks[weekKey]) {
                    weeks[weekKey] = {
                        label: 'Semana ' + formatDateShort(weekStart),
                        regular: 0,
                        overtime: 0,
                        holiday: 0
                    };
                }
                
                const dateKey = getDateKey(date);
                const isHoliday = isDayHoliday(date);
                
                state.employees.filter(e => e.active).forEach(emp => {
                    const key = `${emp.id}-${dateKey}`;
                    const att = state.attendance[key];
                    
                    if (att && att.present) {
                        const regularHours = Math.min(att.hoursWorked, state.settings.regularHoursPerDay);
                        
                        if (isHoliday || att.isHoliday) {
                            weeks[weekKey].holiday += att.hoursWorked;
                        } else {
                            weeks[weekKey].regular += regularHours;
                            if (att.hoursWorked > state.settings.regularHoursPerDay) {
                                weeks[weekKey].overtime += att.hoursWorked - state.settings.regularHoursPerDay;
                            }
                        }
                    }
                });
            }
            
            const sortedWeeks = Object.keys(weeks).sort();
            
            return {
                labels: sortedWeeks.map(k => weeks[k].label),
                regular: sortedWeeks.map(k => weeks[k].regular),
                overtime: sortedWeeks.map(k => weeks[k].overtime),
                holiday: sortedWeeks.map(k => weeks[k].holiday)
            };
        }

        function getHeatmapData() {
            const startDate = new Date(state.dashboardStartDate);
            const endDate = new Date(state.dashboardEndDate);
            const activeEmployees = state.employees.filter(e => e.active);
            const totalEmployees = activeEmployees.length;
            
            // Agrupar por semanas
            const weeks = [];
            let currentWeek = [];
            let weekStart = new Date(startDate);
            weekStart.setDate(weekStart.getDate() - weekStart.getDay()); // Ir al domingo
            
            for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                const date = new Date(d);
                const dateKey = getDateKey(date);
                
                // Contar presentes
                let presentCount = 0;
                activeEmployees.forEach(emp => {
                    const key = `${emp.id}-${dateKey}`;
                    const att = state.attendance[key];
                    if (att && att.present) presentCount++;
                });
                
                const percentage = totalEmployees > 0 ? Math.round((presentCount / totalEmployees) * 100) : 0;
                
                currentWeek.push({
                    date: formatDateShort(date),
                    present: presentCount,
                    total: totalEmployees,
                    percentage
                });
                
                // Si es sábado o es el último día, cerrar semana
                if (date.getDay() === 6 || date.getTime() === endDate.getTime()) {
                    // Rellenar días faltantes al inicio
                    while (currentWeek.length < 7 && currentWeek[0]) {
                        currentWeek.unshift({
                            date: '',
                            present: 0,
                            total: 0,
                            percentage: 0
                        });
                    }
                    
                    // Rellenar días faltantes al final
                    while (currentWeek.length < 7) {
                        currentWeek.push({
                            date: '',
                            present: 0,
                            total: 0,
                            percentage: 0
                        });
                    }
                    
                    weeks.push({ days: currentWeek });
                    currentWeek = [];
                }
            }
            
            return { weeks };
        }

        function calculateReportData(startDate, endDate) {
            const activeEmployees = state.employees.filter(e => e.active);
            const totalEmployees = activeEmployees.length;
            
            // Calcular días laborables en el rango
            let workDays = 0;
            for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                workDays++;
            }
            
            // Calcular datos por posición
            const byPosition = {};
            const activePositions = state.positions.filter(p => p.active);
            
            activePositions.forEach(pos => {
                byPosition[pos.id] = {
                    name: pos.name,
                    color: pos.color,
                    count: 0,
                    totalHours: 0,
                    overtimeHours: 0,
                    possibleAttendances: 0,
                    actualAttendances: 0,
                    attendance: 0,
                    approxCost: 0
                };
            });
            
            // Procesar empleados
            activeEmployees.forEach(emp => {
                const posId = emp.positions?.[0];
                if (!posId || !byPosition[posId]) return;
                
                byPosition[posId].count++;
                byPosition[posId].possibleAttendances += workDays;
                
                // Calcular horas y asistencias en el rango
                for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                    const key = `${emp.id}-${getDateKey(new Date(d))}`;
                    const att = state.attendance[key];
                    
                    if (att && att.present) {
                        byPosition[posId].actualAttendances++;
                        byPosition[posId].totalHours += att.hoursWorked || 0;
                        byPosition[posId].overtimeHours += att.overtimeHours || 0;
                    }
                }
            });
            
            // Calcular porcentajes y costos aproximados
            let totalHours = 0;
            let totalOvertimeHours = 0;
            let totalCost = 0;
            let totalPossible = 0;
            let totalActual = 0;
            
            Object.keys(byPosition).forEach(posId => {
                const pos = byPosition[posId];
                const position = activePositions.find(p => p.id === posId);
                
                pos.attendance = pos.possibleAttendances > 0 
                    ? Math.round((pos.actualAttendances / pos.possibleAttendances) * 100)
                    : 0;
                
                // Cálculo aproximado de costo (basado en configuración de salario)
                if (position && position.salaryConfig) {
                    const dailyRate = calculateDailyRate(position.salaryConfig);
                    const hourlyRate = dailyRate / 8; // Asumiendo 8h día
                    pos.approxCost = Math.round(pos.totalHours * hourlyRate);
                }
                
                totalHours += pos.totalHours;
                totalOvertimeHours += pos.overtimeHours;
                totalCost += pos.approxCost;
                totalPossible += pos.possibleAttendances;
                totalActual += pos.actualAttendances;
            });
            
            const avgAttendance = totalPossible > 0 
                ? Math.round((totalActual / totalPossible) * 100)
                : 0;
            
            return {
                totalEmployees,
                workDays,
                avgAttendance,
                totalHours,
                overtimeHours: totalOvertimeHours,
                totalCost,
                byPosition: Object.values(byPosition).filter(p => p.count > 0)
            };
        }
        
        function calculateDailyRate(salaryConfig) {
            const amount = salaryConfig.amount || 0;
            const period = salaryConfig.period || 'month';
            const workDays = salaryConfig.workDays?.length || 5;
            
            switch(period) {
                case 'day': return amount;
                case 'week': return amount / workDays;
                case 'biweekly': return amount / (workDays * 2);
                case '3weeks': return amount / (workDays * 3);
                case 'month': return amount / (workDays * 4.33);
                default: return amount / 26; // Fallback
            }
        }

        // Generar asistencia de prueba para últimos 7 días
        function generateDemoAttendance() {
            const attendance = {};
            const today = new Date();
            
            for (let i = 0; i < 7; i++) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);
                const dateKey = getDateKey(date);
                
                demoData.employees.forEach((emp, idx) => {
                    // 80% de probabilidad de asistir
                    if (Math.random() > 0.2) {
                        const key = `${emp.id}-${dateKey}`;
                        const hours = 8 + (Math.random() > 0.7 ? 2 : 0); // 30% trabaja 10h
                        attendance[key] = {
                            employeeId: emp.id,
                            date: dateKey,
                            present: true,
                            hoursWorked: hours,
                            overtimeHours: hours > 8 ? hours - 8 : 0,
                            isHoliday: false,
                            useTempPosition: false,
                            notes: '',
                            multiPosition: false,
                            positionHours: [{ positionId: emp.position, hours: hours }]
                        };
                    }
                });
            }
            
            return attendance;
        }

            renderProgress() {
                const total = this.steps.length;

                        </div>
                        <div style="color: #64748b; font-size: 0.875rem; font-weight: 600;">
                            Paso ${current} de ${total}
                        </div>
                    </div>
                `;
            }
            
            next() {
                if (state.onboardingStep < this.steps.length - 1) {
                    state.onboardingStep++;
                    render();
                }
            }

                if (state.onboardingStep > 0) {
                    state.onboardingStep--;
                    render();
                }

                const input = document.getElementById('onboarding-company-name');

                const name = input.value.trim();

                    return;
                }
                
                state.settings.companyName = name;
                this.next();
            }
            
            complete() {
                if (state.onboardingMode === 'scratch') {
                    // Guardar datos permanentemente
                    localStorage.setItem('onboardingCompleted', 'true');
                    saveToLocalStorage();
                    showNotification('✅ ¡Sistema configurado! Tus datos se han guardado', 'success');
                } else {
                    // Modo demo: NO guardar en localStorage

                render();

        window.selectHours = function(hours) {
            state.settings.regularHoursPerDay = hours;
            render();
        };
        
        window.quickAddPosition = function(name) {
            const colors = ['#10b981', '#f59e0b', '#3b82f6', '#06b6d4', '#8b5cf6', '#ec4899'];
            const existingPos = state.positions.find(p => p.name === name && p.active);
            
            if (existingPos) {
                showNotification(`⚠️ La posición "${name}" ya existe`, 'error');
                return;
            }
            
            const newPosition = {
                id: name.toLowerCase().replace(/\s+/g, '-') + '-' + Date.now(),
                name: name,
                salaryConfig: {
                    amount: 30000,
                    period: 'month',
                    workDays: [1, 2, 3, 4, 5, 6]
                },
                color: colors[state.positions.length % colors.length],
                leaderId: null,
                active: true
            };
            
            state.positions.push(newPosition);
            showNotification(`✅ Posición "${name}" agregada`, 'success');
            render();
        };

            state.positions = state.positions.filter(p => p.id !== positionId);

            const name = nameInput.value.trim();
            const positionId = positionSelect.value;
            
            if (name.length < 2) {
                showNotification('❌ El nombre debe tener al menos 2 caracteres', 'error');
                return;
            }
            
            const newNumber = String(state.employees.length + 1).padStart(3, '0');
            const newEmployee = {
                id: 'EMP' + Date.now(),
                number: newNumber,
                name: name,
                position: positionId,
                positions: [positionId],
                active: true
            };
            
            state.employees.push(newEmployee);
            showNotification(`✅ Empleado "${name}" agregado`, 'success');
            
            // Limpiar formulario
            nameInput.value = '';
            
            render();
        };
        
        window.removeEmployee = function(employeeId) {
            state.employees = state.employees.filter(e => e.id !== employeeId);
            render();
        };
        
        // ============================================
        // CSS ADICIONAL PARA ANIMACIONES
        // ============================================
        
        const additionalStyles = `
            @keyframes bounce {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-20px); }
            }
            
            @keyframes pulse {
                0%, 100% { box-shadow: 0 12px 40px rgba(6, 182, 212, 0.4); }
                50% { box-shadow: 0 16px 60px rgba(6, 182, 212, 0.6); }
            }
        `;
        
        const styleTag = document.createElement('style');
        styleTag.textContent = additionalStyles;
        document.head.appendChild(styleTag);
        
        // Cargar datos al iniciar
        loadFromLocalStorage();
        
        // Mostrar onboarding si es necesario
        onboardingWizard.show();
        
        // Renderizar por primera vez
        render();
    </script>
</body>
</html>
